name: CI&CD

on:
  workflow_dispatch:
  push:
    paths:
      - 'prReviewersAutoAssigner/**'
      - '.github/workflows/**'

env:
  REGISTRY: ghcr.io
  RL_IMAGE_NAME: k3sslerx/avitointership/prreviewersautoassigner

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: |
          export GO111MODULE=on
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run golangci-lint
        working-directory: ./prReviewersAutoAssigner
        run: golangci-lint run --timeout 5m ./...

      - name: Run staticcheck
        working-directory: ./prReviewersAutoAssigner
        run: staticcheck ./...

  build-and-push-prreviewersautoassigner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./prReviewersAutoAssigner
          file: ./prReviewersAutoAssigner/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.RL_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.RL_IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
